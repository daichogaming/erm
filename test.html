<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAT Practice — Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;400;500&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #111111; --gray-dark: #3A3A3A; --gray-mid: #767676;
      --gray-light: #C4C4C4; --gray-border: #DCDCDC; --gray-bg: #F5F5F5;
      --white: #FFFFFF; --answer-hover: #F0F0F0; --answer-selected: #111111;
      --answer-selected-text: #FFFFFF; --correct: #1a7a3c; --incorrect: #c0392b;
    }
    html, body { font-family: 'DM Sans', sans-serif; background: var(--white); color: var(--black); height: 100%; font-size: 15px; -webkit-font-smoothing: antialiased; overflow: hidden; }

    /* ── TOP BAR ── */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; height: 52px;
      border-bottom: 1px solid var(--gray-border);
      background: var(--white); position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    }
    .top-bar-left { display: flex; align-items: center; gap: 1rem; }
    .top-bar-logo { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.06em; color: var(--black); text-transform: uppercase; }
    .top-bar-sep { color: var(--gray-border); font-size: 18px; font-weight: 200; }
    .top-bar-module { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--gray-mid); letter-spacing: 0.05em; }
    .top-bar-center { display: flex; align-items: center; gap: 0.5rem; }
    .timer {
      font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500;
      color: var(--black); letter-spacing: 0.06em; min-width: 68px; text-align: center;
    }
    .timer.warning { color: #c0392b; }
    .timer-toggle {
      font-size: 11px; color: var(--gray-mid); cursor: pointer;
      border: 1px solid var(--gray-border); border-radius: 4px;
      padding: 3px 8px; font-family: 'DM Mono', monospace;
      transition: color 0.15s, border-color 0.15s;
    }
    .timer-toggle:hover { color: var(--black); border-color: var(--black); }
    .top-bar-right { display: flex; align-items: center; gap: 0.75rem; }
    .btn-exit {
      font-size: 13px; color: var(--gray-mid); background: none;
      border: 1px solid var(--gray-border); border-radius: 6px;
      padding: 6px 14px; cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-exit:hover { color: var(--black); border-color: var(--black); }

    /* ── LOADING STATE ── */
    .loading-screen {
      position: fixed; inset: 0; background: var(--white);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem; z-index: 500;
    }
    .loading-screen.hidden { display: none; }
    .loading-spinner {
      width: 32px; height: 32px; border: 2px solid var(--gray-border);
      border-top-color: var(--black); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--gray-mid); letter-spacing: 0.08em; }

    /* ── MAIN LAYOUT ── */
    .test-body {
      position: fixed; top: 52px; bottom: 56px; left: 0; right: 0;
      display: flex; overflow: hidden;
    }

    /* ── DRAGGABLE DIVIDER ── */
    .divider {
      width: 6px; flex-shrink: 0; cursor: col-resize;
      background: var(--gray-border);
      position: relative; z-index: 10;
      transition: background 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .divider:hover, .divider.dragging { background: var(--gray-mid); }
    .divider::after {
      content: '';
      width: 2px; height: 32px;
      background: var(--gray-light);
      border-radius: 2px;
      display: block;
    }
    .divider:hover::after, .divider.dragging::after { background: var(--white); }

    /* ── PASSAGE PANE ── */
    .passage-pane {
      flex: 1; overflow-y: auto; padding: 2.5rem 2rem 2.5rem 2.5rem;
      min-width: 200px;
    }
    .passage-context {
      font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--gray-mid); margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: 10px;
    }
    .passage-skill-tag {
      background: var(--gray-bg); border: 1px solid var(--gray-border);
      border-radius: 2px; padding: 2px 8px; font-size: 10px; color: var(--gray-mid);
      font-family: 'DM Mono', monospace; letter-spacing: 0.06em;
    }
    .passage-difficulty {
      padding: 2px 8px; border-radius: 2px; font-size: 10px;
      font-family: 'DM Mono', monospace; letter-spacing: 0.06em;
      border: 1px solid var(--gray-border);
    }
    .diff-easy { color: #1a7a3c; border-color: #b7dfc7; background: #edf7f1; }
    .diff-medium { color: #7a5c00; border-color: #e0d0a0; background: #fdf9ed; }
    .diff-hard { color: #c0392b; border-color: #f0b0a8; background: #fdf0ee; }
    .passage-text {
      font-family: 'Source Serif 4', serif; font-size: 15px; line-height: 1.85;
      color: var(--black); font-weight: 300;
    }
    .passage-text p + p { margin-top: 1rem; }
    .passage-label {
      font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gray-mid);
      text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.6rem; margin-top: 1.5rem;
    }
    .passage-label:first-child { margin-top: 0; }

    /* ── QUESTION PANE ── */
    .question-pane {
      width: 420px; flex-shrink: 0; overflow-y: auto;
      padding: 2.5rem 2.5rem 2.5rem 2rem;
      display: flex; flex-direction: column;
      min-width: 280px;
    }
    .q-number {
      font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--gray-mid); margin-bottom: 1rem;
    }
    .q-text {
      font-family: 'Source Serif 4', serif; font-size: 16px; font-weight: 400;
      line-height: 1.65; color: var(--black); margin-bottom: 2rem;
    }
    .answers { display: flex; flex-direction: column; gap: 0.6rem; }
    .answer-option {
      display: flex; align-items: flex-start; gap: 0.85rem;
      padding: 0.85rem 1rem; border: 1px solid var(--gray-border);
      border-radius: 4px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: var(--white);
    }
    .answer-option:hover { border-color: var(--black); background: var(--answer-hover); }
    .answer-option.selected { border-color: var(--black); background: var(--answer-selected); }
    .answer-option.selected .answer-letter,
    .answer-option.selected .answer-text { color: var(--white); }
    .answer-option.correct { border-color: var(--correct); background: #edf7f1; }
    .answer-option.correct .answer-letter,
    .answer-option.correct .answer-text { color: var(--correct); }
    .answer-option.incorrect { border-color: var(--incorrect); background: #fdf0ee; }
    .answer-option.incorrect .answer-letter,
    .answer-option.incorrect .answer-text { color: var(--incorrect); }
    .answer-letter {
      font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
      color: var(--gray-mid); min-width: 18px; padding-top: 1px;
      transition: color 0.15s;
    }
    .answer-text { font-size: 14px; color: var(--black); line-height: 1.5; transition: color 0.15s; }
    .flag-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 1.5rem; cursor: pointer; width: fit-content; }
    .flag-row input[type="checkbox"] { accent-color: var(--black); width: 14px; height: 14px; cursor: pointer; }
    .flag-label { font-size: 12px; color: var(--gray-mid); cursor: pointer; user-select: none; }

    /* ── RATIONALE BOX (post-submit) ── */
    .rationale-box {
      margin-top: 1.5rem; padding: 1rem; border: 1px solid var(--gray-border);
      border-radius: 4px; background: var(--gray-bg);
      font-size: 13px; color: var(--gray-dark); line-height: 1.6;
    }
    .rationale-label {
      font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--gray-mid); margin-bottom: 0.5rem;
    }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
      border-top: 1px solid var(--gray-border); background: var(--white);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; gap: 1rem;
    }
    .q-nav { display: flex; align-items: center; gap: 6px; flex: 1; overflow-x: auto; padding: 4px 0; }
    .q-dot {
      width: 30px; height: 30px; border-radius: 4px; border: 1px solid var(--gray-border);
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gray-mid);
      cursor: pointer; flex-shrink: 0; transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .q-dot:hover { border-color: var(--black); color: var(--black); }
    .q-dot.active { border-color: var(--black); background: var(--black); color: var(--white); }
    .q-dot.answered { border-color: var(--black); color: var(--black); }
    .q-dot.flagged { border-color: #c0392b; color: #c0392b; }
    .q-dot.flagged.answered { background: #fff5f5; }
    .nav-buttons { display: flex; gap: 0.6rem; flex-shrink: 0; }
    .btn-nav {
      font-size: 13px; font-family: 'DM Sans', sans-serif;
      border: 1px solid var(--gray-border); background: var(--white);
      border-radius: 6px; padding: 7px 18px; cursor: pointer;
      color: var(--gray-mid); transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .btn-nav:hover { color: var(--black); border-color: var(--black); }
    .btn-nav.primary { background: var(--black); color: var(--white); border-color: var(--black); }
    .btn-nav.primary:hover { background: var(--gray-dark); border-color: var(--gray-dark); }

    /* ── REVIEW / SCORE OVERLAY ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300; align-items: center; justify-content: center; }
    .overlay.active { display: flex; }
    .overlay-box {
      background: var(--white); border-radius: 6px; width: 100%; max-width: 520px;
      max-height: 80vh; overflow-y: auto; padding: 2.5rem; animation: fadeSlide 0.2s ease;
    }
    @keyframes fadeSlide { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .overlay-title { font-family: 'Source Serif 4', serif; font-size: 26px; font-weight: 300; color: var(--black); margin-bottom: 0.5rem; }
    .overlay-sub { font-size: 13px; color: var(--gray-mid); margin-bottom: 1.5rem; }
    .score-big { font-family: 'Source Serif 4', serif; font-size: 56px; font-weight: 300; color: var(--black); line-height: 1; }
    .score-label { font-size: 13px; color: var(--gray-mid); margin-bottom: 1.5rem; }
    .score-breakdown { display: flex; gap: 2rem; margin-bottom: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--gray-border); }
    .score-stat .num { font-family: 'DM Mono', monospace; font-size: 22px; color: var(--black); }
    .score-stat .lbl { font-size: 11px; color: var(--gray-mid); text-transform: uppercase; letter-spacing: 0.08em; font-family: 'DM Mono', monospace; }
    .domain-breakdown { margin-bottom: 2rem; }
    .domain-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid var(--gray-border); font-size: 12px; }
    .domain-name { flex: 1; color: var(--black); }
    .domain-score { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--gray-mid); }
    .domain-bar-wrap { width: 80px; height: 4px; background: var(--gray-border); border-radius: 2px; }
    .domain-bar { height: 4px; background: var(--black); border-radius: 2px; }
    .review-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; }
    .review-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid var(--gray-border); font-size: 13px; cursor: pointer; }
    .review-item:hover { color: var(--gray-mid); }
    .review-num { font-family: 'DM Mono', monospace; width: 28px; color: var(--gray-mid); }
    .review-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-correct { background: var(--correct); }
    .status-incorrect { background: var(--incorrect); }
    .status-unanswered { background: var(--gray-light); }
    .overlay-btn-row { display: flex; gap: 0.75rem; }
    .overlay-btn { flex: 1; font-size: 13px; font-family: 'DM Sans', sans-serif; border: 1px solid var(--gray-border); background: var(--white); border-radius: 6px; padding: 10px 0; cursor: pointer; color: var(--gray-mid); transition: color 0.15s, border-color 0.15s; }
    .overlay-btn:hover { color: var(--black); border-color: var(--black); }
    .overlay-btn.primary { background: var(--black); color: var(--white); border-color: var(--black); }
    .overlay-btn.primary:hover { background: var(--gray-dark); }

    @media (max-width: 720px) {
      .passage-pane { display: none; }
      .divider { display: none; }
      .question-pane { width: 100% !important; padding: 1.5rem; }
    }
  </style>
</head>
<body>

<!-- LOADING SCREEN -->
<div class="loading-screen" id="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-label">Loading questions…</div>
</div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-bar-left">
    <div class="top-bar-logo">SAT Practice</div>
    <div class="top-bar-sep">|</div>
    <div class="top-bar-module" id="bar-module">English · Module</div>
  </div>
  <div class="top-bar-center">
    <div class="timer" id="timer">32:00</div>
    <div class="timer-toggle" id="timer-toggle" onclick="toggleTimer()">Hide</div>
  </div>
  <div class="top-bar-right">
    <button class="btn-exit" onclick="confirmExit()">Exit</button>
    <button class="btn-nav primary" onclick="openReview()" style="font-size:13px;">Review & Submit</button>
  </div>
</div>

<!-- MAIN -->
<div class="test-body">
  <div class="passage-pane" id="passage-pane"></div>
  <div class="divider" id="divider"></div>
  <div class="question-pane" id="question-pane"></div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="q-nav" id="q-nav"></div>
  <div class="nav-buttons">
    <button class="btn-nav" onclick="prevQuestion()">← Back</button>
    <button class="btn-nav primary" id="btn-next" onclick="nextQuestion()">Next →</button>
  </div>
</div>

<!-- REVIEW OVERLAY -->
<div class="overlay" id="review-overlay">
  <div class="overlay-box">
    <div class="overlay-title">Review Answers</div>
    <div class="overlay-sub" id="review-sub">Check your answers before submitting.</div>
    <div class="review-list" id="review-list"></div>
    <div class="overlay-btn-row">
      <button class="overlay-btn" onclick="closeOverlay('review-overlay')">Continue Test</button>
      <button class="overlay-btn primary" onclick="submitTest()">Submit</button>
    </div>
  </div>
</div>

<!-- SCORE OVERLAY -->
<div class="overlay" id="score-overlay">
  <div class="overlay-box">
    <div class="overlay-title">Module Complete</div>
    <div class="overlay-sub" id="score-sub">—</div>
    <div class="score-big" id="score-num">—</div>
    <div class="score-label" id="score-pct">— correct</div>
    <div class="score-breakdown">
      <div class="score-stat"><div class="num" id="sc-correct">—</div><div class="lbl">Correct</div></div>
      <div class="score-stat"><div class="num" id="sc-incorrect">—</div><div class="lbl">Incorrect</div></div>
      <div class="score-stat"><div class="num" id="sc-unanswered">—</div><div class="lbl">Unanswered</div></div>
    </div>
    <div class="domain-breakdown" id="domain-breakdown"></div>
    <div class="review-list" id="score-review-list"></div>
    <div class="overlay-btn-row">
      <button class="overlay-btn" onclick="window.location.href='index.html'">← Back to Tests</button>
      <button class="overlay-btn primary" onclick="closeOverlay('score-overlay')">Review Answers</button>
    </div>
  </div>
</div>

<script src="questionbank.js"></script>
<script>
// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
const params   = new URLSearchParams(window.location.search);
const testId   = params.get('test')   || 'test01';
const label    = params.get('label')  || 'Practice Test 1';
const moduleId = params.get('module') || '1A';

const moduleKey = `${testId}_${moduleId}`;
let QUESTIONS = [];

const totalSecs   = 32 * 60;
let currentQ      = 0;
let answers       = [];
let flagged       = [];
let timerSecs     = totalSecs;
let timerHidden   = false;
let timerInterval = null;
let submitted     = false;

// ── Load questions ────────────────────────────────────────────
function initTest() {
  // QUESTION_BANK is loaded from questionbank.js
  if (typeof QUESTION_BANK === 'undefined') {
    document.getElementById('loading-screen').innerHTML =
      '<div style="font-family:\'DM Mono\',monospace;font-size:13px;color:#c0392b;">Error: questionbank.js not found.<br>Make sure all files are in the same folder.</div>';
    return;
  }

  const rawQuestions = QUESTION_BANK[moduleKey];
  if (!rawQuestions || rawQuestions.length === 0) {
    document.getElementById('loading-screen').innerHTML =
      `<div style="font-family:'DM Mono',monospace;font-size:13px;color:#c0392b;">No questions found for module: ${moduleKey}</div>`;
    return;
  }

  // Sort into SAT RW domain order: Craft & Structure → Information & Ideas → Standard English → Expression of Ideas
  const DOMAIN_ORDER = ['Craft and Structure', 'Information and Ideas', 'Standard English', 'Expression of Ideas'];
  const _grouped = {};
  DOMAIN_ORDER.forEach(d => _grouped[d] = []);
  rawQuestions.forEach(q => {
    const match = DOMAIN_ORDER.find(d => q.domain && q.domain.startsWith(d));
    if (match) _grouped[match].push(q);
  });
  QUESTIONS = DOMAIN_ORDER.flatMap(d => _grouped[d]);

  const totalQ = QUESTIONS.length;
  answers = new Array(totalQ).fill(null);
  flagged = new Array(totalQ).fill(false);

  document.getElementById('bar-module').textContent =
    `English · ${label} · Module ${moduleId}`;
  document.getElementById('score-sub').textContent =
    `${label} · Module ${moduleId}`;

  document.getElementById('loading-screen').classList.add('hidden');
  buildNav();
  renderQuestion(0);
  startTimer();
}

window.addEventListener('load', initTest);

// ── Timer ─────────────────────────────────────────────────────
function startTimer() {
  timerInterval = setInterval(() => {
    if (submitted) return;
    timerSecs--;
    updateTimerDisplay();
    if (timerSecs <= 0) { clearInterval(timerInterval); submitTest(); }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer');
  if (timerHidden) { el.textContent = 'Hidden'; el.classList.remove('warning'); return; }
  const m = Math.floor(timerSecs / 60).toString().padStart(2, '0');
  const s = (timerSecs % 60).toString().padStart(2, '0');
  el.textContent = `${m}:${s}`;
  el.classList.toggle('warning', timerSecs <= 300);
}

function toggleTimer() {
  timerHidden = !timerHidden;
  document.getElementById('timer-toggle').textContent = timerHidden ? 'Show' : 'Hide';
  updateTimerDisplay();
}

// ── Navigation ────────────────────────────────────────────────
function buildNav() {
  const nav = document.getElementById('q-nav');
  nav.innerHTML = '';
  for (let i = 0; i < QUESTIONS.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'q-dot';
    dot.textContent = i + 1;
    dot.id = `dot-${i}`;
    dot.onclick = () => goToQuestion(i);
    nav.appendChild(dot);
  }
  updateNav();
}

function updateNav() {
  for (let i = 0; i < QUESTIONS.length; i++) {
    const dot = document.getElementById(`dot-${i}`);
    dot.className = 'q-dot';
    if (i === currentQ) dot.classList.add('active');
    if (answers[i] !== null) dot.classList.add('answered');
    if (flagged[i]) dot.classList.add('flagged');
  }
}

function goToQuestion(i) {
  currentQ = i;
  renderQuestion(i);
  updateNav();
}

function prevQuestion() {
  if (currentQ > 0) goToQuestion(currentQ - 1);
}

function nextQuestion() {
  if (currentQ < QUESTIONS.length - 1) goToQuestion(currentQ + 1);
  else openReview();
}

// ── Render ────────────────────────────────────────────────────
function renderQuestion(i) {
  const q = QUESTIONS[i];
  const totalQ = QUESTIONS.length;

  // Passage pane
  const pp = document.getElementById('passage-pane');
  const diffClass = { Easy: 'diff-easy', Medium: 'diff-medium', Hard: 'diff-hard' }[q.difficulty] || '';
  const diffLabel = q.difficulty || '';

  // Handle dual-passage (Text 1 / Text 2)
  let passageHTML = '';
  const raw = q.passage || '';
  if (/^Text 1\b/i.test(raw)) {
    const t2idx = raw.search(/Text 2\b/i);
    if (t2idx > 0) {
      const t1 = raw.slice(0, t2idx).replace(/^Text 1\s*/i, '').trim();
      const t2 = raw.slice(t2idx).replace(/^Text 2\s*/i, '').trim();
      passageHTML = `
        <div class="passage-label">Text 1</div>
        <div class="passage-text"><p>${escHtml(t1)}</p></div>
        <div class="passage-label">Text 2</div>
        <div class="passage-text"><p>${escHtml(t2)}</p></div>`;
    } else {
      passageHTML = `<div class="passage-text">${raw.split('\n\n').map(p=>`<p>${escHtml(p)}</p>`).join('')}</div>`;
    }
  } else {
    passageHTML = `<div class="passage-text">${raw.split('\n\n').map(p=>`<p>${escHtml(p)}</p>`).join('')}</div>`;
  }

  pp.innerHTML = `
    <div class="passage-context">
      <span>${q.domain || 'Reading and Writing'}</span>
      <span class="passage-skill-tag">${q.skill || ''}</span>
      ${diffLabel ? `<span class="passage-difficulty ${diffClass}">${diffLabel}</span>` : ''}
    </div>
    ${passageHTML}`;

  // Question pane
  const qp = document.getElementById('question-pane');
  const letters = ['A','B','C','D'];
  const choicesHTML = q.choices.map((c, ci) => {
    let cls = 'answer-option';
    if (submitted) {
      if (ci === q.answer) cls += ' correct';
      else if (ci === answers[i] && ci !== q.answer) cls += ' incorrect';
    } else {
      if (answers[i] === ci) cls += ' selected';
    }
    return `<div class="${cls}" onclick="selectAnswer(${i},${ci})">
      <div class="answer-letter">${letters[ci]}</div>
      <div class="answer-text">${escHtml(c)}</div>
    </div>`;
  }).join('');

  const rationaleHTML = submitted && q.rationale ? `
    <div class="rationale-box">
      <div class="rationale-label">Explanation</div>
      ${escHtml(q.rationale)}
    </div>` : '';

  qp.innerHTML = `
    <div class="q-number">Question ${i + 1} of ${totalQ}</div>
    <div class="q-text">${escHtml(q.question)}</div>
    <div class="answers">${choicesHTML}</div>
    <label class="flag-row">
      <input type="checkbox" id="flag-cb" ${flagged[i] ? 'checked' : ''} onchange="toggleFlag(${i})">
      <span class="flag-label">Flag for review</span>
    </label>
    ${rationaleHTML}`;

  document.getElementById('btn-next').textContent =
    i === totalQ - 1 ? 'Review →' : 'Next →';
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function selectAnswer(qi, ci) {
  if (submitted) return;
  answers[qi] = ci;
  updateNav();
  renderQuestion(qi);
}

function toggleFlag(qi) {
  flagged[qi] = document.getElementById('flag-cb').checked;
  updateNav();
}

// ── Review Overlay ────────────────────────────────────────────
function openReview() {
  const unanswered = answers.filter(a => a === null).length;
  const flagCount  = flagged.filter(Boolean).length;
  document.getElementById('review-sub').textContent =
    `${unanswered} unanswered · ${flagCount} flagged`;

  document.getElementById('review-list').innerHTML = QUESTIONS.map((q, i) => {
    const status = answers[i] === null
      ? '<span style="color:var(--gray-mid)">Not answered</span>'
      : `<span style="color:var(--black)">Answer ${['A','B','C','D'][answers[i]]}</span>`;
    const flagMark = flagged[i] ? ' <span style="color:#c0392b;font-size:11px;">★ Flagged</span>' : '';
    return `<div class="review-item" onclick="closeOverlay('review-overlay');goToQuestion(${i})">
      <div class="review-num">${i+1}</div>
      <div style="flex:1;font-size:13px;color:var(--black);">${escHtml(q.question.substring(0,60))}…</div>
      <div>${status}${flagMark}</div>
    </div>`;
  }).join('');

  document.getElementById('review-overlay').classList.add('active');
}

function closeOverlay(id) {
  document.getElementById(id).classList.remove('active');
}

// ── Submit ────────────────────────────────────────────────────
function submitTest() {
  submitted = true;
  clearInterval(timerInterval);

  const totalQ     = QUESTIONS.length;
  const correct    = QUESTIONS.filter((q, i) => answers[i] === q.answer).length;
  const incorrect  = QUESTIONS.filter((q, i) => answers[i] !== null && answers[i] !== q.answer).length;
  const unanswered = answers.filter(a => a === null).length;
  const pct        = Math.round((correct / totalQ) * 100);

  document.getElementById('score-num').textContent = `${correct}/${totalQ}`;
  document.getElementById('score-pct').textContent = `${pct}% correct`;
  document.getElementById('sc-correct').textContent   = correct;
  document.getElementById('sc-incorrect').textContent = incorrect;
  document.getElementById('sc-unanswered').textContent = unanswered;

  // Domain breakdown
  const domains = ['Information and Ideas', 'Craft and Structure', 'Expression of Ideas', 'Standard English'];
  const domainShort = {
    'Information and Ideas': 'Information & Ideas',
    'Craft and Structure': 'Craft & Structure',
    'Expression of Ideas': 'Expression of Ideas',
    'Standard English': 'Standard English',
  };
  let domHtml = '';
  for (const d of domains) {
    const dQs = QUESTIONS.map((q,i) => ({q,i})).filter(({q}) => q.domain === d);
    if (dQs.length === 0) continue;
    const dCorrect = dQs.filter(({q,i}) => answers[i] === q.answer).length;
    const dTotal = dQs.length;
    const pct = Math.round((dCorrect / dTotal) * 100);
    domHtml += `<div class="domain-row">
      <div class="domain-name">${domainShort[d]}</div>
      <div class="domain-bar-wrap"><div class="domain-bar" style="width:${pct}%"></div></div>
      <div class="domain-score">${dCorrect}/${dTotal}</div>
    </div>`;
  }
  document.getElementById('domain-breakdown').innerHTML = domHtml;

  // Score review list
  document.getElementById('score-review-list').innerHTML = QUESTIONS.map((q, i) => {
    let statusClass = 'status-unanswered', statusLabel = 'Unanswered';
    if (answers[i] !== null) {
      statusClass = answers[i] === q.answer ? 'status-correct' : 'status-incorrect';
      statusLabel = answers[i] === q.answer ? 'Correct' : 'Incorrect';
    }
    return `<div class="review-item" onclick="closeOverlay('score-overlay');goToQuestion(${i})">
      <div class="review-num">${i+1}</div>
      <div class="review-status ${statusClass}"></div>
      <div style="flex:1;font-size:13px;color:var(--black);">${escHtml(q.question.substring(0,55))}…</div>
      <div style="font-size:12px;color:var(--gray-mid);">${statusLabel}</div>
    </div>`;
  }).join('');

  closeOverlay('review-overlay');
  document.getElementById('score-overlay').classList.add('active');
  renderQuestion(currentQ);
}


// ── Exit ──────────────────────────────────────────────────────
function confirmExit() {
  if (confirm('Exit this module? Your progress will not be saved.')) {
    window.location.href = 'index.html';
  }
}

// ── Draggable Divider ─────────────────────────────────────────
(function() {
  const divider   = document.getElementById('divider');
  const passPane  = document.getElementById('passage-pane');
  const qPane     = document.getElementById('question-pane');
  const container = document.querySelector('.test-body');

  let isDragging = false;
  let startX = 0;
  let startPassWidth = 0;

  function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

  divider.addEventListener('mousedown', function(e) {
    isDragging = true;
    startX = e.clientX;
    startPassWidth = passPane.getBoundingClientRect().width;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    const containerWidth = container.getBoundingClientRect().width;
    const dividerWidth   = divider.getBoundingClientRect().width;
    const availableWidth = containerWidth - dividerWidth;
    const delta = e.clientX - startX;
    const newPassWidth = clamp(startPassWidth + delta, 200, availableWidth - 280);
    const newQWidth    = availableWidth - newPassWidth;
    passPane.style.flex  = 'none';
    passPane.style.width = newPassWidth + 'px';
    qPane.style.flex     = 'none';
    qPane.style.width    = newQWidth + 'px';
  });

  document.addEventListener('mouseup', function() {
    if (!isDragging) return;
    isDragging = false;
    divider.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  // Touch support
  divider.addEventListener('touchstart', function(e) {
    isDragging = true;
    startX = e.touches[0].clientX;
    startPassWidth = passPane.getBoundingClientRect().width;
    divider.classList.add('dragging');
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', function(e) {
    if (!isDragging) return;
    const containerWidth = container.getBoundingClientRect().width;
    const dividerWidth   = divider.getBoundingClientRect().width;
    const availableWidth = containerWidth - dividerWidth;
    const delta = e.touches[0].clientX - startX;
    const newPassWidth = clamp(startPassWidth + delta, 200, availableWidth - 280);
    const newQWidth    = availableWidth - newPassWidth;
    passPane.style.flex  = 'none';
    passPane.style.width = newPassWidth + 'px';
    qPane.style.flex     = 'none';
    qPane.style.width    = newQWidth + 'px';
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', function() {
    isDragging = false;
    divider.classList.remove('dragging');
  });
})();
</script>
</body>
