<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>(function(){try{var t=localStorage.getItem('sat-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TMX8HFTQVZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-TMX8HFTQVZ');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — SAT Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --black:#111111; --gray-dark:#3A3A3A; --gray-mid:#767676; --gray-light:#C4C4C4; --gray-border:#DCDCDC; --gray-bg:#F5F5F5; --white:#f2f2f2; }
    :root[data-theme="dark"] { --black:#EDEDED; --gray-dark:#C7C7C7; --gray-mid:#9A9A9A; --gray-light:#5A5A5A; --gray-border:#333333; --gray-bg:#1B1B1B; --white:#121212; }
    html, body { font-family:'DM Sans',sans-serif; background:var(--white); color:var(--black); min-height:100vh; font-size:15px; -webkit-font-smoothing:antialiased; transition:background .2s ease,color .2s ease; }
    .page { display:flex; min-height:100vh; flex-direction:column; }

    .site-header { display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:56px; border-bottom:1px solid var(--gray-border); background:var(--white); position:sticky; top:0; z-index:100; }
    .logo { font-family:'DM Mono',monospace; font-size:14px; font-weight:500; letter-spacing:.06em; color:var(--black); text-transform:uppercase; cursor:pointer; }
    .hdr-right { display:flex; align-items:center; gap:1.5rem; }
    .breadcrumb { font-size:13px; color:var(--gray-mid); display:flex; align-items:center; gap:8px; }
    .breadcrumb .sep { color:var(--gray-light); }
    .breadcrumb .crumb { cursor:pointer; transition:color .15s; }
    .breadcrumb .crumb:hover { color:var(--black); }
    .breadcrumb .cur { color:var(--black); font-weight:500; }
    .back-btn { font-size:13px; color:var(--gray-mid); background:none; border:1px solid var(--gray-border); border-radius:6px; padding:6px 14px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:color .15s,border-color .15s; }
    .back-btn:hover { color:var(--black); border-color:var(--black); }

    .settings-hero { padding:4rem 2.5rem 2.5rem; max-width:860px; margin:0 auto; width:100%; }
    .settings-label { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gray-mid); margin-bottom:1.25rem; }
    .settings-title { font-family:'Source Serif 4',serif; font-size:clamp(32px,5vw,44px); font-weight:300; line-height:1.12; color:var(--black); margin-bottom:.75rem; }
    .settings-sub { font-size:14px; color:var(--gray-mid); max-width:460px; line-height:1.7; font-weight:300; }
    .divider { border:none; border-top:1px solid var(--gray-border); margin:0 2.5rem; }

    .settings-section { max-width:860px; margin:0 auto; width:100%; padding:2.5rem; flex:1; }
    .group-label { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--gray-mid); margin-bottom:1.25rem; display:flex; align-items:center; gap:12px; }
    .group-label::after { content:''; flex:1; height:1px; background:var(--gray-border); }
    .setting-row { margin-bottom:3rem; }
    .setting-row-title { font-size:15px; font-weight:500; color:var(--black); margin-bottom:.3rem; }
    .setting-row-desc { font-size:13px; color:var(--gray-mid); font-weight:300; margin-bottom:1.5rem; max-width:480px; line-height:1.6; }

    .theme-options { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; max-width:520px; }
    .theme-option { border:1px solid var(--gray-border); border-radius:6px; padding:1.25rem; cursor:pointer; transition:border-color .2s,background .2s,transform .15s; }
    .theme-option:hover { border-color:var(--gray-mid); transform:translateY(-1px); }
    .theme-option.active { border-color:var(--black); background:var(--gray-bg); }
    .theme-swatch { width:100%; height:70px; border-radius:4px; border:1px solid var(--gray-border); overflow:hidden; margin-bottom:.9rem; display:flex; flex-direction:column; }
    .swatch-bar { height:16px; flex-shrink:0; }
    .swatch-body { flex:1; display:flex; align-items:center; padding:0 10px; gap:6px; }
    .swatch-line { height:5px; border-radius:2px; }
    .theme-option-row { display:flex; align-items:center; justify-content:space-between; }
    .theme-option-name { font-size:13px; font-weight:500; color:var(--black); }
    .theme-check { width:16px; height:16px; border-radius:50%; border:1px solid var(--gray-border); flex-shrink:0; position:relative; }
    .theme-option.active .theme-check { border-color:var(--black); }
    .theme-option.active .theme-check::after { content:''; position:absolute; inset:3px; border-radius:50%; background:var(--black); }

    .site-footer { border-top:1px solid var(--gray-border); padding:1.25rem 2.5rem; display:flex; align-items:center; justify-content:space-between; margin-top:auto; }
    .footer-copy { font-size:12px; color:var(--gray-light); font-family:'DM Mono',monospace; }
    .footer-note { font-size:12px; color:var(--gray-mid); }

    @media (max-width:600px) {
      .site-header,.settings-hero,.settings-section { padding-left:1.25rem; padding-right:1.25rem; }
      .divider { margin:0 1.25rem; }
      .breadcrumb { display:none; }
      .theme-options { grid-template-columns:1fr; max-width:100%; }
    }
  </style>
</head>
<body>

<div class="page">
  <header class="site-header">
    <div class="logo" onclick="window.location.href='index.html'">SAT Practice</div>
    <div class="hdr-right">
      <div class="breadcrumb"><span class="crumb" onclick="window.location.href='index.html'">Home</span><span class="sep">/</span><span class="cur">Settings</span></div>
      <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
    </div>
  </header>

  <div class="settings-hero">
    <div class="settings-label">Preferences</div>
    <h1 class="settings-title">Settings</h1>
    <p class="settings-sub">Customize how SAT Practice looks and behaves.</p>
  </div>
  <hr class="divider" />

  <div class="settings-section">
    <div class="group-label">Appearance</div>
    <div class="setting-row">
      <div class="setting-row-title">Theme</div>
      <div class="setting-row-desc">Choose how the site looks. Your choice is saved on this device and applied across every page.</div>
      <div class="theme-options">
        <div class="theme-option" id="opt-light" onclick="setTheme('light')">
          <div class="theme-swatch">
            <div class="swatch-bar" style="background:#f2f2f2;border-bottom:1px solid #DCDCDC"></div>
            <div class="swatch-body" style="background:#f2f2f2">
              <div class="swatch-line" style="background:#111111;width:34%"></div>
              <div class="swatch-line" style="background:#C4C4C4;width:22%"></div>
            </div>
          </div>
          <div class="theme-option-row">
            <span class="theme-option-name">Light</span>
            <div class="theme-check"></div>
          </div>
        </div>
        <div class="theme-option" id="opt-dark" onclick="setTheme('dark')">
          <div class="theme-swatch">
            <div class="swatch-bar" style="background:#121212;border-bottom:1px solid #333333"></div>
            <div class="swatch-body" style="background:#121212">
              <div class="swatch-line" style="background:#EDEDED;width:34%"></div>
              <div class="swatch-line" style="background:#5A5A5A;width:22%"></div>
            </div>
          </div>
          <div class="theme-option-row">
            <span class="theme-option-name">Dark</span>
            <div class="theme-check"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer"><div class="footer-copy">SAT Practice · 2025–2026</div><div class="footer-note">Not affiliated with College Board</div></footer>
</div>

<script>
  function getTheme() {
    try { return localStorage.getItem('sat-theme') === 'dark' ? 'dark' : 'light'; }
    catch (e) { return 'light'; }
  }
  function setTheme(theme) {
    try { localStorage.setItem('sat-theme', theme); } catch (e) {}
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    reflectActive();
  }
  function reflectActive() {
    const t = getTheme();
    document.getElementById('opt-light').classList.toggle('active', t === 'light');
    document.getElementById('opt-dark').classList.toggle('active', t === 'dark');
  }
  reflectActive();
</script>
</body>
</html>
