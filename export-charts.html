<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Export graphs</title>
<style>
  body { font: 15px/1.5 Inter, system-ui, sans-serif; background: #F3ECDF; color: #0B1020; margin: 0; padding: 32px 16px; }
  main { max-width: 560px; margin: 0 auto; background: #FBF7EF; border: 1px solid #E2D7C4; border-radius: 14px; padding: 24px; }
  h1 { font: 600 24px/1.2 Georgia, serif; margin: 0 0 8px; }
  button { font: 600 15px Inter, system-ui, sans-serif; color: #fff; background: #0A5FE0; border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #log { margin-top: 16px; font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; color: #444; }
</style>
</head>
<body>
<main>
  <h1>Export graphs</h1>
  <p>For the SATLab team. This collects the 28 Command of Evidence graphs that only the question server has, and saves them as <b>satlab-graphs.json</b>. Send that file to Claude so the graphs can be stored on the site.</p>
  <button id="go" type="button">Collect graphs</button>
  <div id="log" aria-live="polite"></div>
</main>
<script>
// Question id → practice module it is in (from questionbank.js; these questions' graphs are missing there).
var NEED = {"53c6c179":"test01_1B","3dc911d6":"test01_1B","2df730d0":"test02_1B","a9ac31e4":"test02_2B","89f71526":"test03_2A","040583a5":"test04_1A","b074cc05":"test05_1B","a16128e2":"test05_2A","02848335":"test05_2A","f71802d6":"test05_2B","b29c520a":"test06_1A","23e2421a":"test06_2A","3430be35":"test06_2B","be19faa1":"test07_1A","702eb7e3":"test07_2A","ff18829b":"test08_1A","d5da74be":"test09_2B","15873d14":"test09_2B","1703403b":"test10_1A","303bcc41":"test10_1B","8a584241":"test10_2A","a9040290":"test11_2B","403fb4e4":"test11_2B","b470d853":"test12_1B","8a668840":"test12_2B","b71861fc":"test13_1A","df34b586":"test13_2A","742fd8ba":"test13_2B"};
var API = 'https://sat.mrnoobyesyes.workers.dev';
var log = function (t) { document.getElementById('log').textContent += t + '\n'; };
function toDataURL(src) {
  if (/^data:/.test(src)) return Promise.resolve(src);
  return fetch(src).then(function (r) { return r.blob(); }).then(function (b) {
    return new Promise(function (ok) { var f = new FileReader(); f.onload = function () { ok(f.result); }; f.readAsDataURL(b); });
  }).catch(function () { return src; });
}
document.getElementById('go').onclick = async function () {
  this.disabled = true;
  var out = {}, mods = {};
  Object.keys(NEED).forEach(function (id) { (mods[NEED[id]] = mods[NEED[id]] || []).push(id); });
  for (var key of Object.keys(mods)) {
    try {
      var r = await fetch(API + '/api/module?bank=' + encodeURIComponent(key));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var qs = await r.json();
      for (var id of mods[key]) {
        var q = qs.find(function (x) { return x.id === id; });
        var charts = q ? (q.passage_lines || []).filter(function (l) { return l && l.type === 'chart' && l.image; }) : [];
        if (!charts.length) { log('✗ ' + id + ' (' + key + '): no graph on the server'); continue; }
        out[id] = [];
        for (var c of charts) out[id].push({ title: c.title || c.note || '', image: await toDataURL(c.image) });
        log('✓ ' + id + ' (' + key + ')');
      }
    } catch (e) { log('✗ ' + key + ': ' + e.message); }
  }
  var n = Object.keys(out).length;
  log('\n' + n + ' of ' + Object.keys(NEED).length + ' graphs collected.');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: 'application/json' }));
  a.download = 'satlab-graphs.json'; document.body.appendChild(a); a.click();
  log('Saved satlab-graphs.json. Send it to Claude.');
};
</script>
</body>
</html>
