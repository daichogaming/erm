<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TMX8HFTQVZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-TMX8HFTQVZ');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAT Practice — Topical Drill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;400;500&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #111111; --gray-dark: #3A3A3A; --gray-mid: #767676;
      --gray-light: #C4C4C4; --gray-border: #DCDCDC; --gray-bg: #F5F5F5;
      --white: #f2f2f2; --answer-hover: #F0F0F0; --answer-selected: #111111;
      --answer-selected-text: #FFFFFF; --correct: #1a7a3c; --incorrect: #c0392b;
    }
    html, body { font-family: 'DM Sans', sans-serif; background: var(--white); color: var(--black); height: 100%; font-size: 15px; -webkit-font-smoothing: antialiased; overflow: hidden; }

    /* ── TOP BAR ── */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; height: 52px;
      border-bottom: 1px solid var(--gray-border);
      background: var(--white); position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    }
    .top-bar-left { display: flex; align-items: center; gap: 1rem; }
    .top-bar-logo { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.06em; color: var(--black); text-transform: uppercase; }
    .top-bar-sep { color: var(--gray-border); font-size: 18px; font-weight: 200; }
    .top-bar-module { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--gray-mid); letter-spacing: 0.05em; }
    .top-bar-center { display: flex; align-items: center; gap: 0.5rem; }
    .timer {
      font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500;
      color: var(--black); letter-spacing: 0.06em; min-width: 68px; text-align: center;
    }
    .timer.warning { color: #c0392b; }
    .timer-toggle {
      font-size: 11px; color: var(--gray-mid); cursor: pointer;
      border: 1px solid var(--gray-border); border-radius: 4px;
      padding: 3px 8px; font-family: 'DM Mono', monospace;
      transition: color 0.15s, border-color 0.15s;
    }
    .timer-toggle:hover { color: var(--black); border-color: var(--black); }
    .top-bar-right { display: flex; align-items: center; gap: 0.75rem; }
    .btn-exit {
      font-size: 13px; color: var(--gray-mid); background: none;
      border: 1px solid var(--gray-border); border-radius: 6px;
      padding: 6px 14px; cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-exit:hover { color: var(--black); border-color: var(--black); }

    /* ── LOADING STATE ── */
    .loading-screen {
      position: fixed; inset: 0; background: var(--white);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem; z-index: 500;
    }
    .loading-screen.hidden { display: none; }
    .loading-spinner {
      width: 32px; height: 32px; border: 2px solid var(--gray-border);
      border-top-color: var(--black); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--gray-mid); letter-spacing: 0.08em; }

    /* ── MAIN LAYOUT ── */
    .test-body {
      position: fixed; top: 52px; bottom: 56px; left: 0; right: 0;
      display: flex; overflow: hidden;
    }

    /* ── DRAGGABLE DIVIDER ── */
    .divider {
      width: 6px; flex-shrink: 0; cursor: col-resize;
      background: var(--gray-border);
      position: relative; z-index: 10;
      transition: background 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .divider:hover, .divider.dragging { background: var(--gray-mid); }
    .divider::after {
      content: '';
      width: 2px; height: 32px;
      background: var(--gray-light);
      border-radius: 2px;
      display: block;
    }
    .divider:hover::after, .divider.dragging::after { background: var(--white); }

    /* ── PASSAGE PANE ── */
    .passage-pane {
      flex: 1; overflow-y: auto; padding: 2.5rem 2rem 2.5rem 2.5rem;
      min-width: 200px;
    }
    .passage-context {
      font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--gray-mid); margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: 10px;
    }
    .passage-skill-tag {
      background: var(--gray-bg); border: 1px solid var(--gray-border);
      border-radius: 2px; padding: 2px 8px; font-size: 10px; color: var(--gray-mid);
      font-family: 'DM Mono', monospace; letter-spacing: 0.06em;
    }
    .passage-difficulty {
      padding: 2px 8px; border-radius: 2px; font-size: 10px;
      font-family: 'DM Mono', monospace; letter-spacing: 0.06em;
      border: 1px solid var(--gray-border);
    }
    .diff-easy { color: #1a7a3c; border-color: #b7dfc7; background: #edf7f1; }
    .diff-medium { color: #7a5c00; border-color: #e0d0a0; background: #fdf9ed; }
    .diff-hard { color: #c0392b; border-color: #f0b0a8; background: #fdf0ee; }
    .passage-text {
      font-family: 'Source Serif 4', serif; font-size: 15px; line-height: 1.85;
      color: var(--black); font-weight: 300;
    }
    .passage-text p + p { margin-top: 1rem; }
    .passage-label {
      font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gray-mid);
      text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.6rem; margin-top: 1.5rem;
    }
    .passage-label:first-child { margin-top: 0; }

    /* ── QUESTION PANE ── */
    .question-pane {
      width: 420px; flex-shrink: 0; overflow-y: auto;
      padding: 2.5rem 2.5rem 2.5rem 2rem;
      display: flex; flex-direction: column;
      min-width: 280px;
    }
    .q-number {
      font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--gray-mid); margin-bottom: 1rem;
    }
    .q-text {
      font-family: 'Source Serif 4', serif; font-size: 16px; font-weight: 400;
      line-height: 1.65; color: var(--black); margin-bottom: 2rem;
    }
    .answers { display: flex; flex-direction: column; gap: 0.6rem; }
    .answer-option {
      display: flex; align-items: flex-start; gap: 0.85rem;
      padding: 0.85rem 1rem; border: 1px solid var(--gray-border);
      border-radius: 4px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: var(--white);
    }
    .answer-option:hover { border-color: var(--black); background: var(--answer-hover); }
    .answer-option.selected { border-color: var(--black); background: var(--answer-selected); }
    .answer-option.selected .answer-letter,
    .answer-option.selected .answer-text { color: var(--white); }
    .answer-option.correct { border-color: var(--correct); background: #edf7f1; }
    .answer-option.correct .answer-letter,
    .answer-option.correct .answer-text { color: var(--correct); }
    .answer-option.incorrect { border-color: var(--incorrect); background: #fdf0ee; }
    .answer-option.incorrect .answer-letter,
    .answer-option.incorrect .answer-text { color: var(--incorrect); }
    .answer-letter {
      font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
      color: var(--gray-mid); min-width: 18px; padding-top: 1px;
      transition: color 0.15s;
    }
    .answer-text { font-size: 14px; color: var(--black); line-height: 1.5; transition: color 0.15s; }
    .flag-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 1.5rem; cursor: pointer; width: fit-content; }
    .flag-row input[type="checkbox"] { accent-color: var(--black); width: 14px; height: 14px; cursor: pointer; }
    .flag-label { font-size: 12px; color: var(--gray-mid); cursor: pointer; user-select: none; }

    /* ── RATIONALE BOX (post-submit) ── */
    .rationale-box {
      margin-top: 1.5rem; padding: 1rem; border: 1px solid var(--gray-border);
      border-radius: 4px; background: var(--gray-bg);
      font-size: 13px; color: var(--gray-dark); line-height: 1.6;
    }
    .rationale-label {
      font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--gray-mid); margin-bottom: 0.5rem;
    }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
      border-top: 1px solid var(--gray-border); background: var(--white);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; gap: 1rem;
    }
    .q-nav { display: flex; align-items: center; gap: 6px; flex: 1; overflow-x: auto; padding: 4px 0; }
    .q-dot {
      width: 30px; height: 30px; border-radius: 4px; border: 1px solid var(--gray-border);
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gray-mid);
      cursor: pointer; flex-shrink: 0; transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .q-dot:hover { border-color: var(--black); color: var(--black); }
    .q-dot.active { border-color: var(--black); background: var(--black); color: var(--white); }
    .q-dot.answered { border-color: var(--black); color: var(--black); }
    .q-dot.flagged { border-color: #c0392b; color: #c0392b; }
    .q-dot.flagged.answered { background: #fff5f5; }
    .nav-buttons { display: flex; gap: 0.6rem; flex-shrink: 0; }
    .btn-nav {
      font-size: 13px; font-family: 'DM Sans', sans-serif;
      border: 1px solid var(--gray-border); background: var(--white);
      border-radius: 6px; padding: 7px 18px; cursor: pointer;
      color: var(--gray-mid); transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .btn-nav:hover { color: var(--black); border-color: var(--black); }
    .btn-nav.primary { background: var(--black); color: var(--white); border-color: var(--black); }
    .btn-nav.primary:hover { background: var(--gray-dark); border-color: var(--gray-dark); }

    /* ── REVIEW / SCORE OVERLAY ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300; align-items: center; justify-content: center; }
    .overlay.active { display: flex; }
    .overlay-box {
      background: var(--white); border-radius: 6px; width: 100%; max-width: 520px;
      max-height: 80vh; overflow-y: auto; padding: 2.5rem; animation: fadeSlide 0.2s ease;
    }
    @keyframes fadeSlide { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .overlay-title { font-family: 'Source Serif 4', serif; font-size: 26px; font-weight: 300; color: var(--black); margin-bottom: 0.5rem; }
    .overlay-sub { font-size: 13px; color: var(--gray-mid); margin-bottom: 1.5rem; }
    .score-big { font-family: 'Source Serif 4', serif; font-size: 56px; font-weight: 300; color: var(--black); line-height: 1; }
    .score-label { font-size: 13px; color: var(--gray-mid); margin-bottom: 1.5rem; }
    .score-breakdown { display: flex; gap: 2rem; margin-bottom: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--gray-border); }
    .score-stat .num { font-family: 'DM Mono', monospace; font-size: 22px; color: var(--black); }
    .score-stat .lbl { font-size: 11px; color: var(--gray-mid); text-transform: uppercase; letter-spacing: 0.08em; font-family: 'DM Mono', monospace; }
    .domain-breakdown { margin-bottom: 2rem; }
    .domain-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid var(--gray-border); font-size: 12px; }
    .domain-name { flex: 1; color: var(--black); }
    .domain-score { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--gray-mid); }
    .domain-bar-wrap { width: 80px; height: 4px; background: var(--gray-border); border-radius: 2px; }
    .domain-bar { height: 4px; background: var(--black); border-radius: 2px; }
    .review-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; }
    .review-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid var(--gray-border); font-size: 13px; cursor: pointer; }
    .review-item:hover { color: var(--gray-mid); }
    .review-num { font-family: 'DM Mono', monospace; width: 28px; color: var(--gray-mid); }
    .review-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-correct { background: var(--correct); }
    .status-incorrect { background: var(--incorrect); }
    .status-unanswered { background: var(--gray-light); }
    .overlay-btn-row { display: flex; gap: 0.75rem; }
    .overlay-btn { flex: 1; font-size: 13px; font-family: 'DM Sans', sans-serif; border: 1px solid var(--gray-border); background: var(--white); border-radius: 6px; padding: 10px 0; cursor: pointer; color: var(--gray-mid); transition: color 0.15s, border-color 0.15s; }
    .overlay-btn:hover { color: var(--black); border-color: var(--black); }
    .overlay-btn.primary { background: var(--black); color: var(--white); border-color: var(--black); }
    .overlay-btn.primary:hover { background: var(--gray-dark); }

    /* ── HIGHLIGHT & NOTES TOOLBAR ── */
    .passage-toolbar {
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .toolbar-label {
      font-family: 'DM Mono', monospace; font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--gray-mid); margin-right: 0.25rem;
    }
    .hl-btn {
      width: 22px; height: 22px; border-radius: 3px; border: 2px solid transparent;
      cursor: pointer; transition: transform 0.1s, border-color 0.15s;
      flex-shrink: 0;
    }
    .hl-btn:hover { transform: scale(1.15); }
    .hl-btn.active { border-color: var(--black); }
    .hl-btn.hl-yellow { background: #FFE066; }
    .hl-btn.hl-green  { background: #A8E6CF; }
    .hl-btn.hl-blue   { background: #A8D4F5; }
    .hl-btn.hl-pink   { background: #F5A8C8; }
    .toolbar-sep { width: 1px; height: 18px; background: var(--gray-border); margin: 0 0.25rem; }
    .toolbar-action {
      font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--gray-mid); background: none;
      border: 1px solid var(--gray-border); border-radius: 3px;
      padding: 3px 8px; cursor: pointer; transition: color 0.15s, border-color 0.15s;
    }
    .toolbar-action:hover { color: var(--black); border-color: var(--black); }
    .toolbar-action.note-active { color: var(--black); border-color: var(--black); background: var(--gray-bg); }

    /* Highlighted text spans */
    .hl-yellow { background: #FFE066; border-radius: 2px; cursor: pointer; }
    .hl-green  { background: #A8E6CF; border-radius: 2px; cursor: pointer; }
    .hl-blue   { background: #A8D4F5; border-radius: 2px; cursor: pointer; }
    .hl-pink   { background: #F5A8C8; border-radius: 2px; cursor: pointer; }
    .hl-yellow:hover, .hl-green:hover, .hl-blue:hover, .hl-pink:hover {
      filter: brightness(0.92);
    }
    /* Highlighted text with note indicator */
    .has-note::after {
      content: '✎'; font-size: 10px; vertical-align: super;
      margin-left: 1px; opacity: 0.7;
    }

    /* ── NOTE POPUP ── */
    .note-popup {
      position: fixed; z-index: 350; background: var(--white);
      border: 1px solid var(--gray-border); border-radius: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      width: 260px; padding: 0.75rem;
      animation: fadeSlide 0.15s ease;
    }
    .note-popup-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .note-popup-label {
      font-family: 'DM Mono', monospace; font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray-mid);
    }
    .note-popup-close {
      background: none; border: none; cursor: pointer;
      font-size: 16px; color: var(--gray-mid); line-height: 1;
      padding: 0; transition: color 0.15s;
    }
    .note-popup-close:hover { color: var(--black); }
    .note-textarea {
      width: 100%; min-height: 80px; resize: vertical;
      border: 1px solid var(--gray-border); border-radius: 4px;
      padding: 0.5rem; font-family: 'DM Sans', sans-serif; font-size: 13px;
      color: var(--black); outline: none; line-height: 1.5;
      transition: border-color 0.15s;
    }
    .note-textarea:focus { border-color: var(--black); }
    .note-popup-actions {
      display: flex; gap: 0.5rem; margin-top: 0.5rem;
    }
    .note-save-btn {
      flex: 1; font-size: 12px; font-family: 'DM Sans', sans-serif;
      background: var(--black); color: var(--white); border: none;
      border-radius: 4px; padding: 6px 0; cursor: pointer;
      transition: background 0.15s;
    }
    .note-save-btn:hover { background: var(--gray-dark); }
    .note-delete-btn {
      font-size: 12px; font-family: 'DM Sans', sans-serif;
      background: none; color: var(--incorrect);
      border: 1px solid var(--incorrect); border-radius: 4px;
      padding: 6px 10px; cursor: pointer; transition: background 0.15s;
    }
    .note-delete-btn:hover { background: #fdf0ee; }

    /* ── NOTES PANEL (sidebar in question pane) ── */
    .notes-panel {
      margin-top: 1.5rem; border: 1px solid var(--gray-border);
      border-radius: 4px; overflow: hidden;
    }
    .notes-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 0.75rem; background: var(--gray-bg);
      border-bottom: 1px solid var(--gray-border); cursor: pointer;
    }
    .notes-panel-title {
      font-family: 'DM Mono', monospace; font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray-mid);
    }
    .notes-panel-count {
      font-family: 'DM Mono', monospace; font-size: 10px;
      background: var(--black); color: var(--white);
      border-radius: 10px; padding: 1px 6px;
    }
    .notes-panel-body { padding: 0.5rem 0.75rem; }
    .note-entry {
      padding: 0.5rem 0; border-bottom: 1px solid var(--gray-border);
      font-size: 12px; line-height: 1.5;
    }
    .note-entry:last-child { border-bottom: none; }
    .note-entry-quote {
      font-style: italic; color: var(--gray-mid); margin-bottom: 0.2rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .note-entry-text { color: var(--black); }
    .note-entry-edit {
      font-family: 'DM Mono', monospace; font-size: 10px;
      color: var(--gray-mid); cursor: pointer; margin-top: 0.2rem;
      display: inline-block;
    }
    .note-entry-edit:hover { color: var(--black); }
    .passage-text u {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── PASSAGE LAYOUT ── */
    .passage-text { font-size: 15px; line-height: 1.75; color: var(--black); }
    .passage-text p { margin: 0 0 1em 0; }
    .passage-text p:last-child { margin-bottom: 0; }
    /* Poem / structured text */
    .passage-poem { font-size: 15px; line-height: 1.9; color: var(--black); font-family: 'DM Sans', sans-serif; }
    .passage-poem .pline { display: block; }
    .passage-poem .pline-blank { display: block; height: 0.6em; }
    .passage-poem .indent-0 { padding-left: 0; }
    .passage-poem .indent-1 { padding-left: 1.2em; }
    .passage-poem .indent-2 { padding-left: 2.4em; }
    .passage-poem .indent-3 { padding-left: 3.6em; }
    .passage-poem .indent-4 { padding-left: 4.8em; }
    /* Table rendering */
    .passage-table { width: 100%; border-collapse: collapse; margin: 0 0 1.2em 0; font-size: 13.5px; font-family: 'DM Mono', monospace; }
    .passage-table-wrap { overflow-x: auto; margin-bottom: 1.2em; }
    .passage-table-title { font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 0.5em; color: var(--black); font-family: 'DM Sans', sans-serif; line-height: 1.4; }
    .passage-table th { background: #e8e8e8; font-weight: 600; padding: 6px 10px; border: 1px solid #bbb; text-align: center; font-size: 13px; }
    .passage-table td { padding: 5px 10px; border: 1px solid #ccc; text-align: center; }
    .passage-table tr:nth-child(even) td { background: #f7f7f7; }
    .passage-table td:first-child { text-align: left; }
    .passage-table th:first-child { text-align: left; }
    .passage-chart-note { font-size: 13px; color: #888; font-style: italic; border: 1px solid #ddd; padding: 8px 14px; border-radius: 4px; margin-bottom: 1em; }
    .passage-label { font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--gray-mid); margin: 1.25rem 0 0.5rem 0; }
    .passage-label:first-child { margin-top: 0; }

    @media (max-width: 720px) {
      .passage-pane { display: none; }
      .divider { display: none; }
      .question-pane { width: 100% !important; padding: 1.5rem; }
    }
  </style>
</head>
<body>

<!-- LOADING SCREEN -->
<div class="loading-screen" id="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-label">Loading questions…</div>
</div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-bar-left">
    <div class="top-bar-logo">SAT Practice</div>
    <div class="top-bar-sep">|</div>
    <div class="top-bar-module" id="bar-module">Topical Drill · Loading…</div>
  </div>
  <div class="top-bar-center">
    <div class="timer" id="timer">32:00</div>
    <div class="timer-toggle" id="timer-toggle" onclick="toggleTimer()">Hide</div>
  </div>
  <div class="top-bar-right">
    <button class="btn-exit" onclick="confirmExit()">Exit</button>
    <button class="btn-nav primary" onclick="openReview()" style="font-size:13px;">Review & Submit</button>
  </div>
</div>

<!-- MAIN -->
<div class="test-body">
  <div class="passage-pane" id="passage-pane"></div>
  <div class="divider" id="divider"></div>
  <div class="question-pane" id="question-pane"></div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="q-nav" id="q-nav"></div>
  <div class="nav-buttons">
    <button class="btn-nav" onclick="prevQuestion()">← Back</button>
    <button class="btn-nav primary" id="btn-next" onclick="nextQuestion()">Next →</button>
  </div>
</div>

<!-- REVIEW OVERLAY -->
<div class="overlay" id="review-overlay">
  <div class="overlay-box">
    <div class="overlay-title">Review Answers</div>
    <div class="overlay-sub" id="review-sub">Check your answers before submitting.</div>
    <div class="review-list" id="review-list"></div>
    <div class="overlay-btn-row">
      <button class="overlay-btn" onclick="closeOverlay('review-overlay')">Continue Test</button>
      <button class="overlay-btn primary" onclick="submitTest()">Submit</button>
    </div>
  </div>
</div>

<!-- SCORE OVERLAY -->
<div class="overlay" id="score-overlay">
  <div class="overlay-box">
    <div class="overlay-title">Module Complete</div>
    <div class="overlay-sub" id="score-sub">—</div>
    <div class="score-big" id="score-num">—</div>
    <div class="score-label" id="score-pct">— correct</div>
    <div class="score-breakdown">
      <div class="score-stat"><div class="num" id="sc-correct">—</div><div class="lbl">Correct</div></div>
      <div class="score-stat"><div class="num" id="sc-incorrect">—</div><div class="lbl">Incorrect</div></div>
      <div class="score-stat"><div class="num" id="sc-unanswered">—</div><div class="lbl">Unanswered</div></div>
    </div>
    <div class="domain-breakdown" id="domain-breakdown"></div>
    <div class="review-list" id="score-review-list"></div>
    <div class="overlay-btn-row">
      <button class="overlay-btn" onclick="window.location.href='index.html'">← Back to Drills</button>
      <button class="overlay-btn primary" onclick="closeOverlay('score-overlay')">Review Answers</button>
    </div>
  </div>
</div>

<script src="drillbank.js"></script>
<script>
// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
const params     = new URLSearchParams(window.location.search);
const topicSlug  = params.get('topic')  || 'words-in-context';
const moduleNum  = params.get('module') || '1';
const skillLabel = params.get('label')  || 'Topical Drill';

const moduleKey = `${topicSlug}_${moduleNum}`;
let QUESTIONS = [];

let totalSecs     = 18 * 60; // recalculated once question count is known
let currentQ      = 0;
let answers       = [];
let flagged       = [];
let timerSecs     = totalSecs;
let timerHidden   = false;
let timerInterval = null;
let submitted     = false;

// ── Load questions ────────────────────────────────────────────
function initTest() {
  // DRILL_BANK is loaded from drillbank.js
  if (typeof DRILL_BANK === 'undefined') {
    document.getElementById('loading-screen').innerHTML =
      '<div style="font-family:\'DM Mono\',monospace;font-size:13px;color:#c0392b;">Error: drillbank.js not found.<br>Make sure all files are in the same folder.</div>';
    return;
  }

  const rawQuestions = DRILL_BANK[moduleKey];
  if (!rawQuestions || rawQuestions.length === 0) {
    document.getElementById('loading-screen').innerHTML =
      `<div style="font-family:'DM Mono',monospace;font-size:13px;color:#c0392b;">No questions found for module: ${moduleKey}</div>`;
    return;
  }

  // Drill modules are already single-skill — keep the bank's natural order
  QUESTIONS = rawQuestions;

  const totalQ = QUESTIONS.length;
  answers = new Array(totalQ).fill(null);
  flagged = new Array(totalQ).fill(false);
  initHighlights(totalQ);

  // Pace like the real RW module: ~71 seconds per question (32 min / 27 q)
  totalSecs = Math.round(totalQ * 32 * 60 / 27);
  timerSecs = totalSecs;

  document.getElementById('bar-module').textContent =
    `Topical Drill · ${skillLabel} · Module ${moduleNum}`;
  document.getElementById('score-sub').textContent =
    `${skillLabel} · Module ${moduleNum}`;

  document.getElementById('loading-screen').classList.add('hidden');
  buildNav();
  renderQuestion(0);
  startTimer();
}

window.addEventListener('load', initTest);

// ── Timer ─────────────────────────────────────────────────────
function startTimer() {
  timerInterval = setInterval(() => {
    if (submitted) return;
    timerSecs--;
    updateTimerDisplay();
    if (timerSecs <= 0) { clearInterval(timerInterval); submitTest(); }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer');
  if (timerHidden) { el.textContent = 'Hidden'; el.classList.remove('warning'); return; }
  const m = Math.floor(timerSecs / 60).toString().padStart(2, '0');
  const s = (timerSecs % 60).toString().padStart(2, '0');
  el.textContent = `${m}:${s}`;
  el.classList.toggle('warning', timerSecs <= 300);
}

function toggleTimer() {
  timerHidden = !timerHidden;
  document.getElementById('timer-toggle').textContent = timerHidden ? 'Show' : 'Hide';
  updateTimerDisplay();
}

// ── Navigation ────────────────────────────────────────────────
function buildNav() {
  const nav = document.getElementById('q-nav');
  nav.innerHTML = '';
  for (let i = 0; i < QUESTIONS.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'q-dot';
    dot.textContent = i + 1;
    dot.id = `dot-${i}`;
    dot.onclick = () => goToQuestion(i);
    nav.appendChild(dot);
  }
  updateNav();
}

function updateNav() {
  for (let i = 0; i < QUESTIONS.length; i++) {
    const dot = document.getElementById(`dot-${i}`);
    dot.className = 'q-dot';
    if (i === currentQ) dot.classList.add('active');
    if (answers[i] !== null) dot.classList.add('answered');
    if (flagged[i]) dot.classList.add('flagged');
  }
}

function goToQuestion(i) {
  currentQ = i;
  renderQuestion(i);
  updateNav();
}

function prevQuestion() {
  if (currentQ > 0) goToQuestion(currentQ - 1);
}

function nextQuestion() {
  if (currentQ < QUESTIONS.length - 1) goToQuestion(currentQ + 1);
  else openReview();
}

// ── Render ────────────────────────────────────────────────────
function renderQuestion(i) {
  const q = QUESTIONS[i];
  const totalQ = QUESTIONS.length;

  // Passage pane
  const pp = document.getElementById('passage-pane');
  const diffClass = { Easy: 'diff-easy', Medium: 'diff-medium', Hard: 'diff-hard' }[q.difficulty] || '';
  const diffLabel = q.difficulty || '';

  // Build passage HTML from structured passage_lines (preserves indentation, blank lines, poems)
  function buildPassageHTML(q) {
    const lines = q.passage_lines;

    // Render a single table entry
    function renderTable(entry) {
      const titleHtml = entry.title ? `<div class="passage-table-title">${escHtml(entry.title)}</div>` : '';
      const thead = `<thead><tr>${entry.headers.map(h=>`<th>${escHtml(h)}</th>`).join('')}</tr></thead>`;
      const tbody = `<tbody>${entry.rows.map(row=>`<tr>${row.map(c=>`<td>${escHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>`;
      return `${titleHtml}<div class="passage-table-wrap"><table class="passage-table">${thead}${tbody}</table></div>`;
    }

    // Helper: render a passage_lines array to HTML
    function renderLines(lineArr) {
      // Handle mixed arrays that may contain table/chart/text entries
      const parts = [];
      let textBuf = [];

      function flushText() {
        if (!textBuf.length) return;
        const hasIndent = textBuf.some(l => l.type === 'line' && l.indent > 0);
        const blankCount = textBuf.filter(l => l.type === 'blank').length;
        const isPoem = hasIndent || blankCount > 2;
        if (isPoem) {
          const html = textBuf.map(l => {
            if (l.type === 'blank') return '<span class="pline-blank"></span>';
            return `<span class="pline indent-${l.indent||0}">${escHtml(l.text||'')}</span>`;
          }).join('');
          parts.push(`<div class="passage-poem">${html}</div>`);
        } else {
          const paras = [];
          let cur = [];
          for (const l of textBuf) {
            const txt = l.text || l;
            if (l.type === 'blank') {
              if (cur.length) { paras.push(cur); cur = []; }
            } else {
              cur.push(typeof txt === 'string' ? txt : '');
            }
          }
          if (cur.length) paras.push(cur);
          if (paras.length)
            parts.push(`<div class="passage-text">${paras.map(p=>`<p>${escHtml(p.join(' '))}</p>`).join('')}</div>`);
        }
        textBuf = [];
      }

      for (const l of lineArr) {
        if (l.type === 'table') {
          flushText();
          parts.push(renderTable(l));
        } else if (l.type === 'chart') {
          flushText();
          parts.push(`<div class="passage-chart-note">${escHtml(l.note || '[Graph — see original source]')}</div>`);
        } else if (l.type === 'text') {
          flushText();
          parts.push(`<div class="passage-text"><p>${escHtml(l.text)}</p></div>`);
        } else {
          textBuf.push(l);
        }
      }
      flushText();
      return parts.join('');
    }

    if (lines && lines.length) {
      // Check for Text 1 / Text 2 split
      const text1Idx = lines.findIndex(l => l.type === 'line' && /^Text\s+1\s*$/i.test(l.text));
      const text2Idx = lines.findIndex(l => l.type === 'line' && /^Text\s+2\s*$/i.test(l.text));

      if (text1Idx !== -1 && text2Idx !== -1 && text2Idx > text1Idx) {
        const t1Lines = lines.slice(text1Idx + 1, text2Idx).filter(l => !(l.type === 'blank' && lines.slice(text1Idx + 1, text1Idx + 2).includes(l)));
        const t2Lines = lines.slice(text2Idx + 1);
        return `<div class="passage-label">Text 1</div>${renderLines(t1Lines)}<div class="passage-label">Text 2</div>${renderLines(t2Lines)}`;
      }

      return renderLines(lines);
    }

    // Fallback to old flat passage string
    const raw = q.passage || '';
    if (/^Text 1\b/i.test(raw)) {
      const t2idx = raw.search(/Text 2\b/i);
      if (t2idx > 0) {
        const t1 = raw.slice(0, t2idx).replace(/^Text 1\s*/i, '').trim();
        const t2 = raw.slice(t2idx).replace(/^Text 2\s*/i, '').trim();
        return `<div class="passage-label">Text 1</div><div class="passage-text"><p>${escHtml(t1)}</p></div><div class="passage-label">Text 2</div><div class="passage-text"><p>${escHtml(t2)}</p></div>`;
      }
    }
    return `<div class="passage-text">${raw.split('\n\n').map(p=>`<p>${escHtml(p)}</p>`).join('')}</div>`;
  }
  let passageHTML = buildPassageHTML(q);

  // Apply underline formatting using precise PDF-extracted segments
  function applyUnderline(html, q) {
    const segments = q.underline_segments;
    if (!segments || !segments.length) return html;

    function norm(s) {
      return s.replace(/\s+/g, ' ')
              .replace(/[\u2018\u2019\u02bc]/g, "'")
              .replace(/[\u201c\u201d]/g, '"')
              .replace(/[\u2013\u2014]/g, '-')
              .replace(/\u2019/g, "'")
              .trim();
    }

    // Walk the HTML char-by-char, skipping tag content, to find and wrap each segment
    function wrapSegment(htmlStr, segText) {
      const segNorm = norm(segText);
      if (!segNorm) return htmlStr;

      // Build plain-text version (strip tags) to locate the segment
      let plain = '';
      let inTag = false;
      for (let i = 0; i < htmlStr.length; i++) {
        if (htmlStr[i] === '<') { inTag = true; continue; }
        if (htmlStr[i] === '>') { inTag = false; continue; }
        if (!inTag) plain += htmlStr[i];
      }
      const plainNorm = norm(plain);

      // Try exact match
      let idx = plainNorm.indexOf(segNorm);
      if (idx === -1) {
        // Try first 40 chars of segment (handles truncated multi-line rects)
        const partial = segNorm.substring(0, Math.min(40, segNorm.length));
        idx = plainNorm.indexOf(partial);
        if (idx === -1) return htmlStr; // can't find it
      }

      const endIdx = idx + segNorm.length;

      // Map plain-text char positions back to HTML positions and wrap
      let charCount = 0, inT = false;
      let startHtmlPos = -1, endHtmlPos = -1;
      for (let i = 0; i < htmlStr.length; i++) {
        if (htmlStr[i] === '<') { inT = true; }
        if (!inT) {
          if (charCount === idx && startHtmlPos === -1) startHtmlPos = i;
          if (charCount === endIdx && endHtmlPos === -1) { endHtmlPos = i; break; }
          charCount++;
        }
        if (htmlStr[i] === '>') { inT = false; }
      }
      if (endHtmlPos === -1) endHtmlPos = htmlStr.length;
      if (startHtmlPos === -1) return htmlStr;

      return htmlStr.slice(0, startHtmlPos) +
             '<u>' + htmlStr.slice(startHtmlPos, endHtmlPos) + '</u>' +
             htmlStr.slice(endHtmlPos);
    }

    // Apply each segment in order
    let result = html;
    for (const seg of segments) {
      result = wrapSegment(result, seg);
    }
    return result;
  }

  pp.innerHTML = `
    <div class="passage-context">
      <span>${q.domain || 'Reading and Writing'}</span>
      <span class="passage-skill-tag">${q.skill || ''}</span>
      ${diffLabel ? `<span class="passage-difficulty ${diffClass}">${diffLabel}</span>` : ''}
    </div>
    <div class="passage-toolbar">
      <span class="toolbar-label">Highlight</span>
      <div class="hl-btn hl-yellow" id="hl-yellow" title="Yellow" onclick="setHighlightColor('hl-yellow')"></div>
      <div class="hl-btn hl-green"  id="hl-green"  title="Green"  onclick="setHighlightColor('hl-green')"></div>
      <div class="hl-btn hl-blue"   id="hl-blue"   title="Blue"   onclick="setHighlightColor('hl-blue')"></div>
      <div class="hl-btn hl-pink"   id="hl-pink"   title="Pink"   onclick="setHighlightColor('hl-pink')"></div>
      <div class="toolbar-sep"></div>
      <button class="toolbar-action" id="btn-clear-hl" onclick="clearAllHighlights()" title="Remove all highlights">Clear</button>
    </div>
    <div id="passage-content">${applyUnderline(passageHTML, q)}</div>`;

  // Question pane
  const qp = document.getElementById('question-pane');
  const letters = ['A','B','C','D'];
  const choicesHTML = q.choices.map((c, ci) => {
    let cls = 'answer-option';
    if (submitted) {
      if (ci === q.answer) cls += ' correct';
      else if (ci === answers[i] && ci !== q.answer) cls += ' incorrect';
    } else {
      if (answers[i] === ci) cls += ' selected';
    }
    return `<div class="${cls}" onclick="selectAnswer(${i},${ci})">
      <div class="answer-letter">${letters[ci]}</div>
      <div class="answer-text">${escHtml(c)}</div>
    </div>`;
  }).join('');

  const rationaleHTML = submitted && q.rationale ? `
    <div class="rationale-box">
      <div class="rationale-label">Explanation</div>
      ${escHtml(q.rationale)}
    </div>` : '';

  qp.innerHTML = `
    <div class="q-number">Question ${i + 1} of ${totalQ}</div>
    <div class="q-text">${escHtml(q.question)}</div>
    <div class="answers">${choicesHTML}</div>
    <label class="flag-row">
      <input type="checkbox" id="flag-cb" ${flagged[i] ? 'checked' : ''} onchange="toggleFlag(${i})">
      <span class="flag-label">Flag for review</span>
    </label>
    ${rationaleHTML}
    <div id="notes-panel"></div>`;

  renderNotesPanel(i);
  restoreHighlights(i);
  updateHighlightButtons();
  attachPassageListener(i);

  document.getElementById('btn-next').textContent =
    i === totalQ - 1 ? 'Review →' : 'Next →';
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function selectAnswer(qi, ci) {
  if (submitted) return;
  answers[qi] = ci;
  updateNav();
  renderQuestion(qi);
}

function toggleFlag(qi) {
  flagged[qi] = document.getElementById('flag-cb').checked;
  updateNav();
}

// ── Review Overlay ────────────────────────────────────────────
function openReview() {
  const unanswered = answers.filter(a => a === null).length;
  const flagCount  = flagged.filter(Boolean).length;
  document.getElementById('review-sub').textContent =
    `${unanswered} unanswered · ${flagCount} flagged`;

  document.getElementById('review-list').innerHTML = QUESTIONS.map((q, i) => {
    const status = answers[i] === null
      ? '<span style="color:var(--gray-mid)">Not answered</span>'
      : `<span style="color:var(--black)">Answer ${['A','B','C','D'][answers[i]]}</span>`;
    const flagMark = flagged[i] ? ' <span style="color:#c0392b;font-size:11px;">★ Flagged</span>' : '';
    return `<div class="review-item" onclick="closeOverlay('review-overlay');goToQuestion(${i})">
      <div class="review-num">${i+1}</div>
      <div style="flex:1;font-size:13px;color:var(--black);">${escHtml(q.question.substring(0,60))}…</div>
      <div>${status}${flagMark}</div>
    </div>`;
  }).join('');

  document.getElementById('review-overlay').classList.add('active');
}

function closeOverlay(id) {
  document.getElementById(id).classList.remove('active');
}

// ── Submit ────────────────────────────────────────────────────
function submitTest() {
  submitted = true;
  clearInterval(timerInterval);

  const totalQ     = QUESTIONS.length;
  const correct    = QUESTIONS.filter((q, i) => answers[i] === q.answer).length;
  const incorrect  = QUESTIONS.filter((q, i) => answers[i] !== null && answers[i] !== q.answer).length;
  const unanswered = answers.filter(a => a === null).length;
  const pct        = Math.round((correct / totalQ) * 100);

  document.getElementById('score-num').textContent = `${correct}/${totalQ}`;
  document.getElementById('score-pct').textContent = `${pct}% correct`;
  document.getElementById('sc-correct').textContent   = correct;
  document.getElementById('sc-incorrect').textContent = incorrect;
  document.getElementById('sc-unanswered').textContent = unanswered;

  // Difficulty breakdown (drills are single-skill, so difficulty is the useful split)
  const diffs = ['Easy', 'Medium', 'Hard'];
  let domHtml = '';
  for (const d of diffs) {
    const dQs = QUESTIONS.map((q,i) => ({q,i})).filter(({q}) => q.difficulty === d);
    if (dQs.length === 0) continue;
    const dCorrect = dQs.filter(({q,i}) => answers[i] === q.answer).length;
    const dTotal = dQs.length;
    const pct = Math.round((dCorrect / dTotal) * 100);
    domHtml += `<div class="domain-row">
      <div class="domain-name">${d}</div>
      <div class="domain-bar-wrap"><div class="domain-bar" style="width:${pct}%"></div></div>
      <div class="domain-score">${dCorrect}/${dTotal}</div>
    </div>`;
  }
  document.getElementById('domain-breakdown').innerHTML = domHtml;

  // Score review list
  document.getElementById('score-review-list').innerHTML = QUESTIONS.map((q, i) => {
    let statusClass = 'status-unanswered', statusLabel = 'Unanswered';
    if (answers[i] !== null) {
      statusClass = answers[i] === q.answer ? 'status-correct' : 'status-incorrect';
      statusLabel = answers[i] === q.answer ? 'Correct' : 'Incorrect';
    }
    return `<div class="review-item" onclick="closeOverlay('score-overlay');goToQuestion(${i})">
      <div class="review-num">${i+1}</div>
      <div class="review-status ${statusClass}"></div>
      <div style="flex:1;font-size:13px;color:var(--black);">${escHtml(q.question.substring(0,55))}…</div>
      <div style="font-size:12px;color:var(--gray-mid);">${statusLabel}</div>
    </div>`;
  }).join('');

  closeOverlay('review-overlay');
  document.getElementById('score-overlay').classList.add('active');
  renderQuestion(currentQ);
}

// ── Highlights & Notes ────────────────────────────────────────
// Storage: highlights[qIndex] = [{id, color, text, note}]
let highlights = [];   // per question array of highlight objects
let activeColor = 'hl-yellow';
let hlCounter   = 0;

function initHighlights(total) {
  highlights = Array.from({length: total}, () => []);
}

function setHighlightColor(color) {
  activeColor = color;
  updateHighlightButtons();
}

function updateHighlightButtons() {
  ['hl-yellow','hl-green','hl-blue','hl-pink'].forEach(c => {
    const btn = document.getElementById(c);
    if (btn) btn.classList.toggle('active', c === activeColor);
  });
}

// Apply saved highlights back to passage DOM after re-render
function restoreHighlights(qi) {
  const content = document.getElementById('passage-content');
  if (!content) return;
  highlights[qi].forEach(h => applyHighlightSpan(content, h));
  attachHighlightListeners(qi);
}

// Called on mouseup in the passage pane — highlight selected text
function handlePassageMouseUp(e, qi) {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;

  const range = sel.getRangeAt(0);
  const content = document.getElementById('passage-content');
  if (!content || !content.contains(range.commonAncestorContainer)) {
    sel.removeAllRanges(); return;
  }

  const selectedText = sel.toString().trim();
  if (!selectedText) return;

  const id = 'hl_' + (++hlCounter);
  const h = { id, color: activeColor, text: selectedText, note: '' };
  highlights[qi].push(h);

  try {
    const span = document.createElement('span');
    span.className = activeColor;
    span.dataset.hlId = id;
    range.surroundContents(span);
  } catch(err) {
    // Selection spans multiple nodes — fallback: just record, no DOM wrap
    highlights[qi].pop();
    sel.removeAllRanges();
    return;
  }

  sel.removeAllRanges();
  attachHighlightListeners(qi);
  renderNotesPanel(qi);
}

function attachHighlightListeners(qi) {
  const content = document.getElementById('passage-content');
  if (!content) return;
  content.querySelectorAll('[data-hl-id]').forEach(span => {
    span.onclick = (e) => {
      e.stopPropagation();
      openNotePopup(span.dataset.hlId, qi, span);
    };
  });
}

// Re-apply a saved highlight to the current DOM (best-effort text search)
function applyHighlightSpan(container, h) {
  // Walk text nodes and wrap first match
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())) {
    const idx = node.textContent.indexOf(h.text);
    if (idx === -1) continue;
    // Don't re-wrap already-wrapped spans
    if (node.parentElement && node.parentElement.dataset && node.parentElement.dataset.hlId) continue;
    const range = document.createRange();
    range.setStart(node, idx);
    range.setEnd(node, idx + h.text.length);
    const span = document.createElement('span');
    span.className = h.color + (h.note ? ' has-note' : '');
    span.dataset.hlId = h.id;
    try { range.surroundContents(span); } catch(e) {}
    break;
  }
}

function clearAllHighlights() {
  highlights[currentQ] = [];
  restorePassageContent();
  renderNotesPanel(currentQ);
}

function restorePassageContent() {
  // Re-render the passage (strips all spans) then re-attach listeners
  renderQuestion(currentQ);
}

// ── Note Popup ────────────────────────────────────────────────
let activePopup = null;

function openNotePopup(hlId, qi, anchorEl) {
  closeNotePopup();
  const h = highlights[qi].find(x => x.id === hlId);
  if (!h) return;

  const popup = document.createElement('div');
  popup.className = 'note-popup';
  popup.id = 'note-popup';
  popup.innerHTML = `
    <div class="note-popup-header">
      <span class="note-popup-label">Note</span>
      <button class="note-popup-close" onclick="closeNotePopup()">×</button>
    </div>
    <div style="font-size:11px;color:var(--gray-mid);margin-bottom:0.4rem;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">"${escHtml(h.text.substring(0,60))}${h.text.length>60?'…':''}"</div>
    <textarea class="note-textarea" id="note-input" placeholder="Add a note…">${escHtml(h.note)}</textarea>
    <div class="note-popup-actions">
      <button class="note-save-btn" onclick="saveNote('${hlId}',${qi})">Save</button>
      <button class="note-delete-btn" onclick="deleteHighlight('${hlId}',${qi})">Remove</button>
    </div>`;

  document.body.appendChild(popup);
  activePopup = popup;

  // Position near the anchor
  const rect = anchorEl.getBoundingClientRect();
  let top = rect.bottom + 6;
  let left = rect.left;
  if (left + 260 > window.innerWidth - 10) left = window.innerWidth - 270;
  if (top + 200 > window.innerHeight - 10) top = rect.top - 206;
  popup.style.top  = top  + 'px';
  popup.style.left = left + 'px';

  document.getElementById('note-input').focus();

  // Close on outside click
  setTimeout(() => {
    document.addEventListener('mousedown', outsidePopupClose);
  }, 10);
}

function outsidePopupClose(e) {
  if (activePopup && !activePopup.contains(e.target)) {
    closeNotePopup();
  }
}

function closeNotePopup() {
  if (activePopup) {
    activePopup.remove();
    activePopup = null;
  }
  document.removeEventListener('mousedown', outsidePopupClose);
}

function saveNote(hlId, qi) {
  const h = highlights[qi].find(x => x.id === hlId);
  if (h) {
    h.note = document.getElementById('note-input').value.trim();
    // Update has-note class on span
    const span = document.querySelector(`[data-hl-id="${hlId}"]`);
    if (span) span.className = h.color + (h.note ? ' has-note' : '');
  }
  closeNotePopup();
  renderNotesPanel(qi);
}

function deleteHighlight(hlId, qi) {
  highlights[qi] = highlights[qi].filter(x => x.id !== hlId);
  closeNotePopup();
  restorePassageContent();
}

// ── Notes Panel ───────────────────────────────────────────────
function renderNotesPanel(qi) {
  const panel = document.getElementById('notes-panel');
  if (!panel) return;
  const qHighlights = highlights[qi] || [];
  const withNotes = qHighlights.filter(h => h.note);

  if (qHighlights.length === 0) {
    panel.innerHTML = '';
    return;
  }

  const entries = qHighlights.map(h => `
    <div class="note-entry">
      <div class="note-entry-quote" style="border-left:3px solid var(--${colorToVar(h.color)});padding-left:6px;">
        "${escHtml(h.text.substring(0,50))}${h.text.length>50?'…':''}"
      </div>
      ${h.note ? `<div class="note-entry-text">${escHtml(h.note)}</div>` : '<div class="notes-empty">No note yet — click highlight to add.</div>'}
      <span class="note-entry-edit" onclick="(function(){var s=document.querySelector('[data-hl-id=\\'${h.id}\\']');if(s)openNotePopup('${h.id}',${qi},s);})()">Edit ↗</span>
    </div>`).join('');

  panel.innerHTML = `
    <div class="notes-panel">
      <div class="notes-panel-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
        <span class="notes-panel-title">Highlights & Notes</span>
        <span class="notes-panel-count">${qHighlights.length}</span>
      </div>
      <div class="notes-panel-body">${entries}</div>
    </div>`;
}

function colorToVar(cls) {
  return {
    'hl-yellow': '--hl-y', 'hl-green': '--hl-g',
    'hl-blue': '--hl-b',   'hl-pink': '--hl-p'
  }[cls] || 'black';
}

// Attach mouseup listener to passage pane for highlighting
function attachPassageListener(qi) {
  const pp = document.getElementById('passage-pane');
  if (!pp) return;
  pp._hlHandler && pp.removeEventListener('mouseup', pp._hlHandler);
  pp._hlHandler = (e) => handlePassageMouseUp(e, qi);
  pp.addEventListener('mouseup', pp._hlHandler);
}

// ── Exit ──────────────────────────────────────────────────────
function confirmExit() {
  if (confirm('Exit this module? Your progress will not be saved.')) {
    window.location.href = 'index.html';
  }
}

// ── Draggable Divider ─────────────────────────────────────────
(function() {
  const divider   = document.getElementById('divider');
  const passPane  = document.getElementById('passage-pane');
  const qPane     = document.getElementById('question-pane');
  const container = document.querySelector('.test-body');

  let isDragging = false;
  let startX = 0;
  let startPassWidth = 0;

  function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

  divider.addEventListener('mousedown', function(e) {
    isDragging = true;
    startX = e.clientX;
    startPassWidth = passPane.getBoundingClientRect().width;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    const containerWidth = container.getBoundingClientRect().width;
    const dividerWidth   = divider.getBoundingClientRect().width;
    const availableWidth = containerWidth - dividerWidth;
    const delta = e.clientX - startX;
    const newPassWidth = clamp(startPassWidth + delta, 200, availableWidth - 280);
    const newQWidth    = availableWidth - newPassWidth;
    passPane.style.flex  = 'none';
    passPane.style.width = newPassWidth + 'px';
    qPane.style.flex     = 'none';
    qPane.style.width    = newQWidth + 'px';
  });

  document.addEventListener('mouseup', function() {
    if (!isDragging) return;
    isDragging = false;
    divider.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  // Touch support
  divider.addEventListener('touchstart', function(e) {
    isDragging = true;
    startX = e.touches[0].clientX;
    startPassWidth = passPane.getBoundingClientRect().width;
    divider.classList.add('dragging');
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', function(e) {
    if (!isDragging) return;
    const containerWidth = container.getBoundingClientRect().width;
    const dividerWidth   = divider.getBoundingClientRect().width;
    const availableWidth = containerWidth - dividerWidth;
    const delta = e.touches[0].clientX - startX;
    const newPassWidth = clamp(startPassWidth + delta, 200, availableWidth - 280);
    const newQWidth    = availableWidth - newPassWidth;
    passPane.style.flex  = 'none';
    passPane.style.width = newPassWidth + 'px';
    qPane.style.flex     = 'none';
    qPane.style.width    = newQWidth + 'px';
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', function() {
    isDragging = false;
    divider.classList.remove('dragging');
  });
})();
</script>
